name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version : '3.11'
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Préparation du livrable
        run: |
          mkdir -p dist
          cp app.py dist/
      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: application
          path: dist/
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
           python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Lancer les tests
        run: pytest -v
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Recuperer l'artefact
        uses: actions/download-artifact@v4
        with:
          name: application
      - name: Verification du secret
        env: 
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          if [ -z "$API_TOKEN" ]; then
            echo "ERREUR : secret absent"
            exit 1
          fi
          echo "Secret présent! longueur ${#API_TOKEN}"
      - name: Déploiement simulé
        run: |
          echo "Déploiement de la version ${{github.sha}}"
          ls -la
       
  
